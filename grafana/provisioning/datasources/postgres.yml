apiVersion: 1

datasources:
  - name: Banking Analytics PostgreSQL
    uid: banking-postgres
    type: postgres
    access: proxy
    url: analytics-postgres:5432
    user: grafana_reader
    secureJsonData:
      password: grafana_reader
    jsonData:
      database: banking_analytics
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    isDefault: true
    editable: false
